<!DOCTYPE html>
<html>
<head>
    <title>Add Teacher</title>

    <style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#eef1f4;color:#222}
.header{background:#263b57;color:#fff;padding:18px 24px;text-align:center;font-size:25px;font-weight:600}
.container{min-height:82vh;display:flex;justify-content:center;align-items:center;padding:30px 15px}
.card{width:500px;background:#fff;padding:30px;border:1px solid #d9dde2;border-radius:6px}
.card h2{text-align:left;color:#263b57;margin-bottom:22px;font-size:22px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:7px;font-weight:600;color:#333}
.form-control{width:100%;padding:11px;border:1px solid #bfc5cc;border-radius:4px;font-size:15px}
.form-control:focus{outline:1px solid #567da8;border-color:#567da8}
.btn{width:100%;background:#2f5f8f;color:#fff;border:0;padding:11px;border-radius:4px;font-size:15px;cursor:pointer}
.btn:hover{background:#254d75}
.back-btn{display:inline-block;margin-top:16px;text-decoration:none;color:#2f5f8f}

    </style>

</head>
<body>

<div class="header">
    College Complaint Portal
</div>

<div class="container">

    <div class="card">

        <h2>Add Teacher</h2>

        <form method="post" action="/add_teacher_post/">

            {% csrf_token %}

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" name="department" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>


            <button type="submit" class="btn">
                Add Teacher
            </button>

        </form>

        <a href="/admin_home" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
