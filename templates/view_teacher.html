<!DOCTYPE html>
<html>
<head>
    <title>View Teachers</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f1f5f9;
        }

        .header{
            background:#1e3a8a;
            color:white;
            padding:20px;
            text-align:center;
            font-size:30px;
            font-weight:bold;
        }

        .container{
            width:90%;
            margin:30px auto;
        }

        h2{
            color:#1e3a8a;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        th{
            background:#2563eb;
            color:white;
            padding:15px;
        }

        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f8fafc;
        }

        .btn{
            padding:8px 16px;
            text-decoration:none;
            color:white;
            border-radius:6px;
            font-size:14px;
        }

        .edit{
            background:#16a34a;
        }

        .edit:hover{
            background:#15803d;
        }

        .delete{
            background:#dc2626;
        }

        .delete:hover{
            background:#b91c1c;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:10px 20px;
            border-radius:8px;
        }

        .back:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="header">
    View Teachers
</div>

<div class="container">

<h2>Total Teachers : {{ data|length }}</h2>

<table>

<tr>

<th>#</th>
<th>Name</th>
<th>Department</th>
<th>Email</th>
<th>Action</th>

</tr>

{% for i in data %}

<tr>

<td>{{ forloop.counter }}</td>

<td>{{ i.name }}</td>

<td>{{ i.department }}</td>

<td>{{ i.email }}</td>

<td>

<a href="/edit_teacher/{{i.id}}/" class="btn edit">

Edit

</a>

<a href="/delete_teacher/{{i.id}}/"
class="btn delete"
onclick="return confirm('Delete this teacher?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</table>

<a href="/admin_home/" class="back">

← Back to Dashboard

</a>

</div>

</body>
</html>
