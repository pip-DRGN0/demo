<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f3f4f6;color:#252525}
.header{background:#263b57;color:#fff;padding:16px 25px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:24px;font-weight:600}
.logout{background:#9b3030;color:#fff;text-decoration:none;padding:8px 14px;border-radius:4px}
.container{padding:32px}
.welcome{margin-bottom:24px}
.welcome h2{font-size:23px;color:#263b57;margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:#fff;padding:23px;border:1px solid #d9dde2;border-radius:6px;text-align:left}
.card h2{color:#263b57;margin-bottom:9px;font-size:19px}
.card p{color:#555;line-height:1.5}
.card a{text-decoration:none;background:#2f5f8f;color:#fff;padding:9px 15px;border-radius:4px;display:inline-block;margin-top:15px}

    </style>
</head>

<body>

<div class="header">

    <h1>Admin Dashboard</h1>

    <a href="/" class="logout">Logout</a>

</div>

<div class="container">

    <div class="welcome">
        <h2>Welcome Admin</h2>
        <p>Manage complaints, students and teachers.</p>
    </div>

    <div class="cards">

        <div class="card">
            <h2>View Complaints</h2>
            <p>Check all submitted complaints.</p>
            <a href="/view_complaints">Open</a>
        </div>

        <div class="card">
            <h2>Add Teacher</h2>
            <p>Add new teachers to the portal.</p>
            <a href="/add_teacher/">Open</a>
        </div>

        <div class="card">
            <h2>View Students</h2>
            <p>See registered students.</p>
            <a href="/view_students">Open</a>
        </div>

        <div class="card">
    <h2>View Teachers</h2>
    <p>View all registered teachers.</p>
    <a href="/view_teacher/">Open</a>
</div>

    </div>

</div>

</body>
</html>
