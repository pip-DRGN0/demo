<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,sans-serif;
        }

        body{
            background:#f1f5f9;
        }

        .header{
            background:#1e3a8a;
            color:white;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .header h1{
            font-size:28px;
        }

        .logout{
            background:red;
            color:white;
            text-decoration:none;
            padding:10px 20px;
            border-radius:8px;
        }

        .container{
            padding:40px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.1);
            transition:0.3s;
            text-align:center;
        }

        .card:hover{
            transform:translateY(-8px);
        }

        .card h2{
            color:#1e3a8a;
            margin-bottom:15px;
        }

        .card a{
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:10px 20px;
            border-radius:8px;
            display:inline-block;
            margin-top:10px;
        }

        .welcome{
            margin-bottom:30px;
        }

    </style>
</head>

<body>

<div class="header">

    <h1>Admin Dashboard</h1>

    <a href="/" class="logout">Logout</a>

</div>

<div class="container">

    <div class="welcome">
        <h2>Welcome Admin</h2>
        <p>Manage complaints, students and teachers.</p>
    </div>

    <div class="cards">

        <div class="card">
            <h2>View Complaints</h2>
            <p>Check all submitted complaints.</p>
            <a href="/view_complaints">Open</a>
        </div>

        <div class="card">
            <h2>Add Teacher</h2>
            <p>Add new teachers to the portal.</p>
            <a href="/add_teacher/">Open</a>
        </div>

        <div class="card">
            <h2>View Students</h2>
            <p>See registered students.</p>
            <a href="/view_students">Open</a>
        </div>

        <div class="card">
    <h2>View Teachers</h2>
    <p>View all registered teachers.</p>
    <a href="/view_teacher/">Open</a>
</div>

    </div>

</div>

</body>
</html>
