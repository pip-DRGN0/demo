<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f1f5f9;
        }

        .header{
            background:#1e3a8a;
            color:white;
            text-align:center;
            padding:20px;
            font-size:28px;
            font-weight:bold;
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:85vh;
        }

        .card{
            background:white;
            width:500px;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            background:#2563eb;
            color:white;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }

        .success{
            background:#d1fae5;
            color:#065f46;
            padding:12px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="header">
    Student Registration
</div>

<div class="container">

<div class="card">

<h2>Create Student Account</h2>

<form method="post" action="/student_register_post/">
    {% csrf_token %}

<div class="form-group">
<label>Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Roll Number</label>
<input type="text" name="rollno" required>
</div>

<div class="form-group">
<label>Department</label>
<input type="text" name="department" required>
</div>

<div class="form-group">
<label>Semester</label>
<input type="text" name="semester" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Username</label>
<input type="text" name="username" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" name="password" required>
</div>

<button class="btn">
    Register
</button>

</form>

<a href="/" class="back">
← Back to Login
</a>

</div>

</div>

</body>
</html>
