<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#eef1f4;color:#222}
.header{background:#263b57;color:#fff;text-align:center;padding:18px;font-size:25px;font-weight:600}
.container{display:flex;justify-content:center;align-items:center;min-height:82vh;padding:25px}
.card{background:#fff;width:500px;padding:30px;border:1px solid #d9dde2;border-radius:6px}
h2{text-align:left;color:#263b57;margin-bottom:22px}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:6px;font-weight:600;color:#333}
input{width:100%;padding:11px;border:1px solid #bfc5cc;border-radius:4px;font-size:15px}
input:focus{outline:1px solid #567da8;border-color:#567da8}
.btn{width:100%;padding:11px;border:0;background:#2f5f8f;color:#fff;border-radius:4px;font-size:15px;cursor:pointer}
.btn:hover{background:#254d75}
.back{display:block;text-align:center;margin-top:15px;text-decoration:none;color:#2f5f8f}
.success{background:#e2f0e6;color:#27623b;padding:10px;border:1px solid #c5dfcd;border-radius:4px;margin-bottom:15px;text-align:center;font-weight:600}

    </style>

</head>

<body>

<div class="header">
    Student Registration
</div>

<div class="container">

<div class="card">

<h2>Create Student Account</h2>

<form method="post" action="/student_register_post/">
    {% csrf_token %}

<div class="form-group">
<label>Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Roll Number</label>
<input type="text" name="rollno" required>
</div>

<div class="form-group">
<label>Department</label>
<input type="text" name="department" required>
</div>

<div class="form-group">
<label>Semester</label>
<input type="text" name="semester" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Username</label>
<input type="text" name="username" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" name="password" required>
</div>

<button class="btn">
    Register
</button>

</form>

<a href="/" class="back">
← Back to Login
</a>

</div>

</div>

</body>
</html>
