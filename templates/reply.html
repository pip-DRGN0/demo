<!DOCTYPE html>
<html>
<head>
    <title>Reply Complaint</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f1f5f9;
        }

        .header{
            background:#1e3a8a;
            color:white;
            text-align:center;
            padding:20px;
            font-size:30px;
            font-weight:bold;
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:85vh;
        }

        .card{
            width:700px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:25px;
        }

        .info{

            margin-bottom:18px;

        }

        .info label{

            font-weight:bold;
            color:#1e3a8a;

        }

        .box{

            background:#f8fafc;
            border:1px solid #ddd;
            padding:12px;
            border-radius:8px;
            margin-top:6px;

        }

        textarea{

            width:100%;
            height:160px;
            resize:none;
            border:1px solid #ccc;
            border-radius:8px;
            padding:12px;
            font-size:15px;

        }

        textarea:focus{

            outline:none;
            border-color:#2563eb;

        }

        .btn{

            width:100%;
            margin-top:20px;
            background:#2563eb;
            color:white;
            border:none;
            padding:13px;
            font-size:17px;
            border-radius:8px;
            cursor:pointer;

        }

        .btn:hover{

            background:#1d4ed8;

        }

        .back{

            display:block;
            text-align:center;
            margin-top:18px;
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;

        }

    </style>

</head>

<body>

<div class="header">

Reply Complaint

</div>

<div class="container">

<div class="card">

<h2>Complaint Details</h2>

<form method="post" action="/reply_post/">

{% csrf_token %}

<input type="hidden" name="id" value="{{data.id}}">

<div class="info">

<label>Student</label>

<div class="box">

{{data.STUDENT.name}}

</div>

</div>

<div class="info">

<label>Complaint Type</label>

<div class="box">

{{data.complaint_type}}

</div>

</div>

<div class="info">

<label>Faculty</label>

<div class="box">

{% if data.TEACHER %}

{{data.TEACHER.name}}

{% else %}

Not Applicable

{% endif %}

</div>

</div>

<div class="info">

<label>Title</label>

<div class="box">

{{data.title}}

</div>

</div>

<div class="info">

<label>Complaint</label>

<div class="box">

{{data.complaint}}

</div>

</div>

<label>Reply</label>

<textarea name="reply" required></textarea>

<button class="btn">

Submit Reply

</button>

</form>

<a href="/view_complaints/" class="back">

← Back to Complaints

</a>

</div>

</div>

</body>
</html>
