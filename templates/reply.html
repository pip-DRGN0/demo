<!DOCTYPE html>
<html>
<head>
    <title>Reply Complaint</title>

    <style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#eef1f4;color:#222}
.header{background:#263b57;color:#fff;text-align:center;padding:18px;font-size:25px;font-weight:600}
.container{display:flex;justify-content:center;align-items:center;min-height:82vh;padding:25px}
.card{width:700px;background:#fff;padding:30px;border:1px solid #d9dde2;border-radius:6px}
h2{text-align:left;color:#263b57;margin-bottom:22px;font-size:22px}
.info{margin-bottom:15px}
.info label{font-weight:600;color:#333}
.box{background:#f4f6f8;border:1px solid #d4d9de;padding:10px;border-radius:4px;margin-top:6px}
textarea{width:100%;height:150px;resize:none;border:1px solid #bfc5cc;border-radius:4px;padding:11px;font-size:15px;margin-top:6px}
textarea:focus{outline:1px solid #567da8;border-color:#567da8}
.btn{width:100%;margin-top:18px;background:#2f5f8f;color:#fff;border:0;padding:12px;font-size:15px;border-radius:4px;cursor:pointer}
.btn:hover{background:#254d75}
.back{display:block;text-align:center;margin-top:16px;text-decoration:none;color:#2f5f8f}

    </style>

</head>

<body>

<div class="header">

Reply Complaint

</div>

<div class="container">

<div class="card">

<h2>Complaint Details</h2>

<form method="post" action="/reply_post/">

{% csrf_token %}

<input type="hidden" name="id" value="{{data.id}}">

<div class="info">

<label>Student</label>

<div class="box">

{{data.STUDENT.name}}

</div>

</div>

<div class="info">

<label>Complaint Type</label>

<div class="box">

{{data.complaint_type}}

</div>

</div>

<div class="info">

<label>Faculty</label>

<div class="box">

{% if data.TEACHER %}

{{data.TEACHER.name}}

{% else %}

Not Applicable

{% endif %}

</div>

</div>

<div class="info">

<label>Title</label>

<div class="box">

{{data.title}}

</div>

</div>

<div class="info">

<label>Complaint</label>

<div class="box">

{{data.complaint}}

</div>

</div>

<label>Reply</label>

<textarea name="reply" required></textarea>

<button class="btn">

Submit Reply

</button>

</form>

<a href="/view_complaints/" class="back">

← Back to Complaints

</a>

</div>

</div>

</body>
</html>
