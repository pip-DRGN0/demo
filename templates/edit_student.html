<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f1f5f9;
        }

        .header{
            background:#1e3a8a;
            color:white;
            text-align:center;
            padding:20px;
            font-size:30px;
            font-weight:bold;
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:85vh;
        }

        .card{
            width:600px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        .btn{
            width:100%;
            background:#2563eb;
            color:white;
            border:none;
            padding:12px;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:20px;
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="header">

Edit Student

</div>

<div class="container">

<div class="card">

<h2>Update Student Details</h2>

<form method="post" action="/edit_student_post/">

{% csrf_token %}

<input type="hidden" name="id" value="{{data.id}}">

<div class="form-group">
<label>Name</label>
<input type="text" name="name" value="{{data.name}}" required>
</div>

<div class="form-group">
<label>Roll Number</label>
<input type="text" name="rollno" value="{{data.rollno}}" required>
</div>

<div class="form-group">
<label>Department</label>
<input type="text" name="department" value="{{data.department}}" required>
</div>

<div class="form-group">
<label>Semester</label>
<input type="text" name="semester" value="{{data.semester}}" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" value="{{data.email}}" required>
</div>

<div class="form-group">
<label>Username</label>
<input type="text" name="username" value="{{data.LOGIN.username}}" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="text" name="password" value="{{data.LOGIN.password}}" required>
</div>

<button type="submit" class="btn">

Update Student

</button>

</form>

<a href="/view_students/" class="back">

← Back to Student List

</a>

</div>

</div>

</body>
</html>
