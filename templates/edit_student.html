<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#eef1f4;color:#222}
.header{background:#263b57;color:#fff;text-align:center;padding:18px;font-size:25px;font-weight:600}
.container{display:flex;justify-content:center;align-items:center;min-height:82vh;padding:25px}
.card{width:600px;background:#fff;padding:30px;border:1px solid #d9dde2;border-radius:6px}
h2{text-align:left;color:#263b57;margin-bottom:22px;font-size:22px}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:6px;font-weight:600}
input{width:100%;padding:10px;border:1px solid #bfc5cc;border-radius:4px;font-size:15px}
input:focus{outline:1px solid #567da8;border-color:#567da8}
.btn{width:100%;background:#2f5f8f;color:#fff;border:0;padding:11px;border-radius:4px;font-size:15px;cursor:pointer}
.btn:hover{background:#254d75}
.back{display:block;text-align:center;margin-top:17px;text-decoration:none;color:#2f5f8f}

    </style>

</head>

<body>

<div class="header">

Edit Student

</div>

<div class="container">

<div class="card">

<h2>Update Student Details</h2>

<form method="post" action="/edit_student_post/">

{% csrf_token %}

<input type="hidden" name="id" value="{{data.id}}">

<div class="form-group">
<label>Name</label>
<input type="text" name="name" value="{{data.name}}" required>
</div>

<div class="form-group">
<label>Roll Number</label>
<input type="text" name="rollno" value="{{data.rollno}}" required>
</div>

<div class="form-group">
<label>Department</label>
<input type="text" name="department" value="{{data.department}}" required>
</div>

<div class="form-group">
<label>Semester</label>
<input type="text" name="semester" value="{{data.semester}}" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" value="{{data.email}}" required>
</div>

<div class="form-group">
<label>Username</label>
<input type="text" name="username" value="{{data.LOGIN.username}}" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="text" name="password" value="{{data.LOGIN.password}}" required>
</div>

<button type="submit" class="btn">

Update Student

</button>

</form>

<a href="/view_students/" class="back">

← Back to Student List

</a>

</div>

</div>

</body>
</html>
