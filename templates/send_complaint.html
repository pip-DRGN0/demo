```html
<!DOCTYPE html>
<html>
<head>
    <title>Send Complaint</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f1f5f9;
        }

        .header{
            background:#1e3a8a;
            color:white;
            padding:20px;
            text-align:center;
            font-size:30px;
            font-weight:bold;
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:85vh;
        }

        .card{
            width:650px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        textarea{
            resize:none;
            height:150px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            outline:none;
            border-color:#2563eb;
        }

        .btn{
            width:100%;
            padding:13px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        .back{
            display:block;
            margin-top:20px;
            text-align:center;
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }

        #teacherDiv{
            display:none;
        }

    </style>

    <script>

        function showTeacher(){

            var type=document.getElementById("type").value;

            if(type=="Faculty"){

                document.getElementById("teacherDiv").style.display="block";

            }

            else{

                document.getElementById("teacherDiv").style.display="none";

            }

        }

    </script>

</head>

<body>

<div class="header">
    College Complaint Portal
</div>

<div class="container">

<div class="card">

<h2>Send Complaint</h2>

<form method="post" action="/send_complaint_post/">

{% csrf_token %}

<div class="form-group">

<label>Complaint Type</label>

<select name="complaint_type" id="type" onchange="showTeacher()" required>

<option value="">Select Complaint Type</option>

<option value="Faculty">Complaint About Faculty</option>

<option value="College">Complaint About College</option>

<option value="Suggestion">Suggestion</option>

<option value="Other">Other</option>

</select>

</div>

<div class="form-group" id="teacherDiv">

<label>Select Faculty</label>

<select name="teacher">

<option value="">Select Faculty</option>

{% for i in teacher %}

<option value="{{ i.id }}">
{{ i.name }} - {{ i.department }}
</option>

{% endfor %}

</select>

</div>

<div class="form-group">

<label>Complaint Title</label>

<input type="text" name="title" required>

</div>

<div class="form-group">

<label>Complaint Description</label>

<textarea name="complaint" required></textarea>

</div>

<button type="submit" class="btn">

Submit Complaint

</button>

</form>

<a href="/student_home/" class="back">

← Back to Dashboard

</a>

</div>

</div>

</body>
</html>
```
