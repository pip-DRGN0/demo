```html
<!DOCTYPE html>
<html>
<head>
    <title>Send Complaint</title>

    <style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#eef1f4;color:#222}
.header{background:#263b57;color:#fff;padding:18px;text-align:center;font-size:25px;font-weight:600}
.container{display:flex;justify-content:center;align-items:center;min-height:82vh;padding:25px}
.card{width:650px;background:#fff;padding:30px;border:1px solid #d9dde2;border-radius:6px}
h2{text-align:left;color:#263b57;margin-bottom:22px;font-size:22px}
.form-group{margin-bottom:17px}
label{display:block;margin-bottom:7px;font-weight:600}
input,select,textarea{width:100%;padding:11px;border:1px solid #bfc5cc;border-radius:4px;font-size:15px}
textarea{resize:none;height:145px}
input:focus,select:focus,textarea:focus{outline:1px solid #567da8;border-color:#567da8}
.btn{width:100%;padding:12px;background:#2f5f8f;color:#fff;border:0;border-radius:4px;font-size:15px;cursor:pointer}
.btn:hover{background:#254d75}
.back{display:block;margin-top:17px;text-align:center;text-decoration:none;color:#2f5f8f}
#teacherDiv{display:none}

    </style>

    <script>

        function showTeacher(){

            var type=document.getElementById("type").value;

            if(type=="Faculty"){

                document.getElementById("teacherDiv").style.display="block";

            }

            else{

                document.getElementById("teacherDiv").style.display="none";

            }

        }

    </script>

</head>

<body>

<div class="header">
    College Complaint Portal
</div>

<div class="container">

<div class="card">

<h2>Send Complaint</h2>

<form method="post" action="/send_complaint_post/">

{% csrf_token %}

<div class="form-group">

<label>Complaint Type</label>

<select name="complaint_type" id="type" onchange="showTeacher()" required>

<option value="">Select Complaint Type</option>

<option value="Faculty">Complaint About Faculty</option>

<option value="College">Complaint About College</option>

<option value="Suggestion">Suggestion</option>

<option value="Other">Other</option>

</select>

</div>

<div class="form-group" id="teacherDiv">

<label>Select Faculty</label>

<select name="teacher">

<option value="">Select Faculty</option>

{% for i in teacher %}

<option value="{{ i.id }}">
{{ i.name }} - {{ i.department }}
</option>

{% endfor %}

</select>

</div>

<div class="form-group">

<label>Complaint Title</label>

<input type="text" name="title" required>

</div>

<div class="form-group">

<label>Complaint Description</label>

<textarea name="complaint" required></textarea>

</div>

<button type="submit" class="btn">

Submit Complaint

</button>

</form>

<a href="/student_home/" class="back">

← Back to Dashboard

</a>

</div>

</div>

</body>
</html>
```
