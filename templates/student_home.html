<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f1f5f9;
        }

        .header{
            background:#1e3a8a;
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 40px;
        }

        .header h1{
            font-size:28px;
        }

        .logout{
            text-decoration:none;
            background:#dc2626;
            color:white;
            padding:10px 20px;
            border-radius:8px;
            transition:.3s;
        }

        .logout:hover{
            background:#b91c1c;
        }

        .container{
            padding:40px;
        }

        .welcome{
            margin-bottom:30px;
        }

        .welcome h2{
            color:#1e3a8a;
            margin-bottom:8px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:15px;
            padding:30px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-8px);
        }


        .card h3{
            color:#1e3a8a;
            margin-bottom:10px;
        }

        .card p{
            color:#555;
            margin-bottom:20px;
        }

        .card a{
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:10px 20px;
            border-radius:8px;
            display:inline-block;
        }

        .card a:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>Student Dashboard</h1>

    <a href="/logout/" class="logout">
        Logout
    </a>

</div>

<div class="container">

<div class="welcome">

    <h2>Welcome {{ student.name }}</h2>

    <p>Student Complaint Management Portal</p>

</div>

<div class="cards">

    <div class="card">


        <h3>Send Complaint</h3>

        <p>Submit a new complaint about faculty or college.</p>

        <a href="/send_complaint/">Open</a>

    </div>

    <div class="card">


        <h3>Complaint History</h3>

        <p>View all complaints and their current status.</p>

        <a href="/complaint_history/">Open</a>

    </div>

    <div class="card">


        <h3>My Profile</h3>

        <p>View your registration details.</p>

        <a href="/student_profile/">Open</a>

    </div>



    </div>

</div>

</div>

</body>
</html>
