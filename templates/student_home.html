<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f3f4f6;color: #9d5d5d
}
.header{background:#263b57;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:17px 30px}
.header h1{font-size:24px;font-weight:600}
.logout{text-decoration:none;background: #396029;color:#fff;padding:8px 14px;border-radius:4px}
.container{padding:32px}
.welcome{margin-bottom:24px}
.welcome h2{color:#263b57;margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}
.card{background:#fff;border:1px solid #d9dde2;border-radius:6px;padding:22px;text-align:left}
.card h3{color:#263b57;margin-bottom:8px}
.card p{color:#555;margin-bottom:16px;line-height:1.45}
.card a{text-decoration:none;background: #5c2f8f;color: rgb(255 255 255 / 0.56);padding:9px 15px;border-radius:4px;display:inline-block}
.card a:hover{background: #25755d
}

    </style>

</head>

<body>

<div class="header">

    <h1>Student Dashboard</h1>

    <a href="/logout/" class="logout">
        Logout
    </a>

</div>

<div class="container">

<div class="welcome">

    <h2>Welcome {{ student.name }}</h2>

    <p>Student Complaint Management Portal</p>

</div>

<div class="cards">

    <div class="card">


        <h3>Send Complaint</h3>

        <p>Submit a new complaint about faculty or college.</p>

        <a href="/send_complaint/">Open</a>

    </div>

    <div class="card">


        <h3>Complaint History</h3>

        <p>View all complaints and their current status.</p>

        <a href="/complaint_history/">Open</a>

    </div>

    <div class="card">


        <h3>My Profile</h3>

        <p>View your registration details.</p>

        <a href="/student_profile/">Open</a>

    </div>



    </div>

</div>

</div>

</body>
</html>
