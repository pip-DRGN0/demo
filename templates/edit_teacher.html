<!DOCTYPE html>

<html>
<head>
    <title>Edit Teacher</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#eef1f4;color:#222}
.container{width:620px;margin:45px auto;background:#fff;padding:30px;border:1px solid #d9dde2;border-radius:6px}
h2{text-align:left;color:#263b57;margin-bottom:24px;font-size:22px}
label{display:block;margin-top:14px;margin-bottom:6px;font-size:15px;font-weight:600}
input{width:100%;padding:11px;border:1px solid #bfc5cc;border-radius:4px;font-size:15px}
input:focus{outline:1px solid #567da8;border-color:#567da8}
.btn{width:100%;background:#2f5f8f;color:#fff;border:0;padding:12px;border-radius:4px;font-size:15px;margin-top:22px;cursor:pointer}
.btn:hover{background:#254d75}
.back{display:inline-block;margin-top:17px;text-decoration:none;color:#2f5f8f}

    </style>
</head>
<body>


<div class="container">
<h2>Edit Teacher</h2>

<form method="post" action="/edit_teacher_post/">
    {% csrf_token %}

    <input type="hidden" name="id" value="{{data.id}}">

    <label>Name</label>
<input type="text" name="name" value="{{data.name}}" required>

<label>Department</label>
<input type="text" name="department" value="{{data.department}}" required>

<label>Email</label>
<input type="email" name="email" value="{{data.email}}" required>

    <button type="submit" class="btn">
        Update Teacher
    </button>

</form>

<a href="/view_teacher/" class="back">
    ← Back to Teacher List
</a>

</div>

</body>
</html>
