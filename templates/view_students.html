<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>

    <style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f3f4f6;color:#222}
.header{background:#263b57;color:#fff;text-align:center;padding:18px;font-size:25px;font-weight:600}
.container{width:95%;margin:28px auto}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #d7dce1}
th{background:#e7ebef;color:#263b57;padding:12px;border-bottom:2px solid #c8ced5}
td{padding:11px;text-align:center;border-bottom:1px solid #e1e4e7}
tr:hover{background:#f7f8f9}
.btn{text-decoration:none;color:#fff;padding:7px 12px;border-radius:4px;margin:2px;display:inline-block}
.edit{background:#287a45}
.edit:hover{background:#216238}
.delete{background:#a83232}
.delete:hover{background:#842727}
.back{display:inline-block;margin-top:18px;text-decoration:none;background:#2f5f8f;color:#fff;padding:9px 16px;border-radius:4px}
.back:hover{background:#254d75}

    </style>

</head>

<body>

<div class="header">

View Students

</div>

<div class="container">

<table>

<tr>

<th>#</th>
<th>Name</th>
<th>Roll No</th>
<th>Department</th>
<th>Semester</th>
<th>Email</th>
<th>Username</th>
<th>Action</th>

</tr>

{% for i in data %}

<tr>

<td>{{ forloop.counter }}</td>

<td>{{ i.name }}</td>

<td>{{ i.rollno }}</td>

<td>{{ i.department }}</td>

<td>{{ i.semester }}</td>

<td>{{ i.email }}</td>

<td>{{ i.LOGIN.username }}</td>

<td>

<a href="/edit_student/{{i.id}}/" class="btn edit">

Edit

</a>

<a href="/delete_student/{{i.id}}/"
class="btn delete"
onclick="return confirm('Delete this student?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</table>

<a href="/admin_home/" class="back">

← Back to Dashboard

</a>

</div>

</body>
</html>
