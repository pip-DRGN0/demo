<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f1f5f9;
        }

        .header{
            background:#1e3a8a;
            color:white;
            text-align:center;
            padding:20px;
            font-size:30px;
            font-weight:bold;
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:85vh;
        }

        .card{
            width:600px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:30px;
        }

        table{
            width:100%;
        }

        td{
            padding:15px;
            font-size:17px;
            border-bottom:1px solid #ddd;
        }

        td:first-child{
            font-weight:bold;
            color:#1e3a8a;
            width:35%;
        }

        .back{

            display:block;
            margin-top:25px;
            text-align:center;
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:12px;
            border-radius:8px;

        }

        .back:hover{

            background:#1d4ed8;

        }

    </style>

</head>

<body>

<div class="header">

Student Profile

</div>

<div class="container">

<div class="card">

<h2>My Details</h2>

<table>

<tr>
<td>Name</td>
<td>{{student.name}}</td>
</tr>

<tr>
<td>Roll Number</td>
<td>{{student.rollno}}</td>
</tr>

<tr>
<td>Department</td>
<td>{{student.department}}</td>
</tr>

<tr>
<td>Semester</td>
<td>{{student.semester}}</td>
</tr>

<tr>
<td>Email</td>
<td>{{student.email}}</td>
</tr>

<tr>
<td>Username</td>
<td>{{student.LOGIN.username}}</td>
</tr>

</table>

<a href="/student_home/" class="back">

← Back to Dashboard

</a>

</div>

</div>

</body>
</html>
