<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#eef1f4;color:#222}
.header{background:#263b57;color:#fff;text-align:center;padding:18px;font-size:25px;font-weight:600}
.container{display:flex;justify-content:center;align-items:center;min-height:82vh;padding:25px}
.card{width:600px;background:#fff;padding:30px;border:1px solid #d9dde2;border-radius:6px}
h2{text-align:left;color:#263b57;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
td{padding:12px;font-size:16px;border-bottom:1px solid #e0e3e6}
td:first-child{font-weight:600;color:#263b57;width:35%}
.back{display:block;margin-top:22px;text-align:center;text-decoration:none;background:#2f5f8f;color:#fff;padding:10px;border-radius:4px}
.back:hover{background:#254d75}

    </style>

</head>

<body>

<div class="header">

Student Profile

</div>

<div class="container">

<div class="card">

<h2>My Details</h2>

<table>

<tr>
<td>Name</td>
<td>{{student.name}}</td>
</tr>

<tr>
<td>Roll Number</td>
<td>{{student.rollno}}</td>
</tr>

<tr>
<td>Department</td>
<td>{{student.department}}</td>
</tr>

<tr>
<td>Semester</td>
<td>{{student.semester}}</td>
</tr>

<tr>
<td>Email</td>
<td>{{student.email}}</td>
</tr>

<tr>
<td>Username</td>
<td>{{student.LOGIN.username}}</td>
</tr>

</table>

<a href="/student_home/" class="back">

← Back to Dashboard

</a>

</div>

</div>

</body>
</html>
