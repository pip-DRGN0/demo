<!DOCTYPE html>
<html>
<head>
    <title>College Complaint Portal</title>

    <style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{height:100vh;display:flex;justify-content:center;align-items:center;background:#eef1f4;color:#222}
.login-box{width:410px;background:#fff;padding:32px;border:1px solid #d3d8dd;border-top:5px solid #263b57;border-radius:5px}
h1{text-align:center;color:#263b57;margin-bottom:8px;font-size:24px}
p{text-align:center;color:#666;margin-bottom:23px}
label{font-weight:600;color:#333}
input[type=text],input[type=password]{width:100%;padding:11px;margin-top:7px;margin-bottom:16px;border:1px solid #bfc5cc;border-radius:4px;font-size:15px}
.role{margin:16px 0}
.role label{font-weight:normal;margin-left:5px}
.btn{width:100%;padding:11px;border:0;border-radius:4px;background:#2f5f8f;color:#fff;font-size:15px;cursor:pointer}
.btn:hover{background:#254d75}
.register{display:block;margin-top:15px;text-align:center;text-decoration:none;color:#2f5f8f}
.register:hover{text-decoration:underline}

    </style>

</head>

<body>

<div class="login-box">

    <h1>College Complaint Portal</h1>

    <p>Student Complaint Management System</p>

    <form method="post" action="/login_post/">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <div class="role">

            <input type="radio" name="type" value="student" required>
            <label>Student</label>

            <br><br>

            <input type="radio" name="type" value="admin">
            <label>Admin</label>

        </div>

        <button class="btn">
            Login
        </button>

    </form>

    <a href="/student_register/" class="register">
        New Student? Register Here
    </a>

</div>

</body>
</html>
